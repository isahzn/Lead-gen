<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Lead Finder</title>
<style>
:root{--bg:#0a0a0a;--p:#141414;--b:#262626;--t:#f5f5f5;--m:#8a8a8a}
@media(prefers-color-scheme:light){:root{--bg:#fafafa;--p:#fff;--b:#e5e5e5;--t:#0a0a0a;--m:#737373}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 Inter,system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:190px;padding:24px 12px;border-right:1px solid var(--b);position:sticky;top:0;height:100vh}nav h1{font-size:15px;letter-spacing:.08em;margin:0 12px 24px;text-transform:uppercase}
nav a{display:block;padding:8px 12px;border-radius:8px;color:var(--m);cursor:pointer}nav a.on,nav a:hover{background:var(--p);color:var(--t)}
main{flex:1;padding:32px;max-width:980px}h2{font-size:26px;margin:0 0 20px;letter-spacing:-.02em}
.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:20px;margin-bottom:14px}
input,select,textarea,button{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:200px}input{margin:0 6px 8px 0}button{cursor:pointer}button.pri{background:var(--t);color:var(--bg);border-color:var(--t)}button:disabled{opacity:.4}
.m{color:var(--m);font-size:13px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.g b{font-size:28px;display:block}
.tag{font-size:11px;border:1px solid var(--b);border-radius:99px;padding:1px 8px;margin-right:4px}.warn{border-color:#a16207;color:#facc15}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--b);font-size:14px}
#stack{position:relative;touch-action:pan-y}.sw{transition:transform .25s}.sw.drag{transition:none}
@media(prefers-reduced-motion:reduce){.sw{transition:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}pre{white-space:pre-wrap;margin:0}
#toast{position:fixed;bottom:20px;right:20px;background:var(--t);color:var(--bg);padding:10px 16px;border-radius:10px;display:none}
@media(max-width:700px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow:auto}nav h1{display:none}}
</style></head><body>
<nav><h1>Lead Finder</h1><a data-v=ov>Overview</a><a data-v=find>Find Leads</a><a data-v=lib>Library</a><a data-v=rev>Email Review</a><a data-v=fu>Follow-ups</a><a data-v=hist>History</a><a data-v=set>Settings</a></nav>
<main id=app></main><div id=toast></div>
<script>
const $=s=>document.querySelector(s),api=async(p,o={})=>{const r=await fetch('/api'+p,o.body instanceof FormData?o:{headers:{'Content-Type':'application/json'},...o,body:o.body&&JSON.stringify(o.body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)};
const V={};let q=[],qi=0;
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>go(a.dataset.v));
async function go(v){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==v));try{await V[v]()}catch(e){$('#app').innerHTML=`<div class="card warn">${esc(e.message)}</div>`}}
V.ov=async()=>{const s=await api('/status'),c=s.counts,n=k=>c[k]||0;$('#app').innerHTML=`<h2>Overview</h2><div class="card g">${['new','qualified','approved','sent','replied','rejected','suppressed'].map(k=>`<div><b>${n(k)}</b><span class=m>${k}</span></div>`).join('')}</div>
<div class=card><b>Follow-ups due:</b> ${s.followups_due}<br><b>SMTP mode:</b> ${s.smtp_mode==='dry'?'DRY-RUN (nothing is really sent)':'LIVE'}<br><b>Search (Brave):</b> ${s.brave_configured?'configured':'no API key — use Add URL / CSV import'}<br><b>Laya:</b> ${s.laya.importable?`v${s.laya.version} importable (not used for scoring yet)`:'not importable: '+esc(s.laya.error)}</div>`};
V.find=async()=>{$('#app').innerHTML=`<h2>Find Leads</h2><div class=card><div class=row><input id=ni placeholder="Niche (e.g. dentist)"><input id=lo placeholder="City / country"><input id=kw placeholder="Keywords (optional)"><select id=pr><option value=brave>Brave Search (needs key)</option><option value=google>Google Places (needs key)</option><option value=demo>Demo (MOCK data)</option></select><input id=ct type=number value=10 style="width:70px"><button class=pri id=go>Search</button></div><pre id=log class=m></pre></div>
<div class=card><b>Add a site by URL</b> <span class=m>(fetches the real page and analyses it)</span><div class=row><input id=u placeholder="example.com" style="width:260px"><input id=un placeholder="Business name (optional)"><button id=ua>Analyse &amp; add</button></div></div>
<div class=card><b>Import from folder</b> <span class=m>drop your own LinkedIn/Sales Navigator CSV exports into the <code>imports</code> folder</span> <button id=fo>Import folder</button></div><div class=card><b>Import CSV</b> <span class=m>columns: name, website, email, phone, niche, location</span><br><input type=file id=f accept=.csv><button id=fi>Import</button></div>`;
$('#go').onclick=async()=>{$('#go').disabled=1;$('#log').textContent='Searching… this can take a minute (each site is fetched).';try{const r=await api('/search',{method:'POST',body:{niche:$('#ni').value,location:$('#lo').value,keywords:$('#kw').value,provider:$('#pr').value,count:+$('#ct').value}});$('#log').textContent=r.log.join('\n')+`\n\nAdded: ${r.added}`}catch(e){$('#log').textContent='Error: '+e.message}$('#go').disabled=0};
$('#ua').onclick=async()=>{try{await api('/add-url',{method:'POST',body:{url:$('#u').value,name:$('#un').value}});toast('Added');$('#u').value=''}catch(e){toast(e.message)}};
$('#fo').onclick=async()=>{try{const r=await api('/import-folder',{method:'POST'});toast(`${r.files} file(s): imported ${r.imported}, dupes ${r.duplicates}`)}catch(e){toast(e.message)}};
$('#fi').onclick=async()=>{const fd=new FormData();fd.append('file',$('#f').files[0]);try{const r=await api('/import',{method:'POST',body:fd});toast(`Imported ${r.imported}, dupes ${r.duplicates}`)}catch(e){toast(e.message)}}};
V.lib=async()=>{const render=async()=>{const L=await api(`/leads?q=${encodeURIComponent($('#sq').value)}&status=${$('#ss').value}`);$('#tb').innerHTML=L.map(l=>`<tr><td><b>${esc(l.name)}</b>${l.is_mock?' <span class="tag warn">MOCK</span>':''}<br><span class=m>${esc(l.website)}</span></td><td>${l.score} <span class=m>${l.confidence}</span></td><td>${esc(l.email||'unknown')} <span class=m>${l.email_check||''}</span></td><td>${l.status}</td><td><button onclick="detail(${l.id})">Open</button></td></tr>`).join('')||'<tr><td colspan=5 class=m>No leads yet. Use Find Leads.</td></tr>'};
$('#app').innerHTML=`<h2>Library</h2><div class=row><input id=sq placeholder=Search><select id=ss><option value="">all</option>${['new','qualified','approved','sent','rejected','suppressed'].map(s=>`<option>${s}</option>`)}</select><a href=/api/export><button>Export CSV</button></a></div><div class=card><table><tr><th>Business<th>Score<th>Email<th>Status<th><tbody id=tb></tbody></table></div>`;$('#sq').oninput=render;$('#ss').onchange=render;render()};
window.detail=async id=>{const l=(await api('/leads')).find(x=>x.id==id);$('#app').innerHTML=`<h2>${esc(l.name)}</h2><div class=card><a href="${esc(l.website)}" target=_blank rel=noopener>${esc(l.website)}</a> · ${esc(l.email||'no email')} · ${esc(l.phone||'no phone')}<br>Score <b>${l.score}</b> (${l.confidence} confidence) · Recommended: ${esc(l.service||'—')}<br><span class=m>${Object.entries(l.reasons).map(([k,v])=>k+': '+(typeof v=='object'?JSON.stringify(v):v)).join(' · ')}</span></div>
<div class=card><b>Evidence</b><ul>${l.evidence.map(e=>`<li>${e.kind==='verified'?'✔':'?'} ${esc(e.fact)} <span class=m>[${e.kind}] <a href="${esc(e.source)}" target=_blank rel=noopener>source</a></span></li>`).join('')||'<li class=m>none</li>'}</ul></div>
<div class=card><b>Notes / tags</b><br><input id=nt value="${esc(l.notes)}" placeholder=notes style="width:60%"><input id=tg value="${esc(l.tags)}" placeholder=tags><button onclick="api('/leads/${id}',{method:'PATCH',body:{notes:nt.value,tags:tg.value}}).then(()=>toast('Saved'))">Save</button> <button onclick="api('/suppress',{method:'POST',body:{email:'${esc(l.email)}'}}).then(()=>toast('Suppressed'))">Suppress contact</button> <button onclick="go('lib')">Back</button></div>`};
V.rev=async()=>{q=(await api('/leads?status=qualified')).concat(await api('/leads?status=approved'));qi=Math.min(qi,Math.max(q.length-1,0));card()};
function card(){const l=q[qi],A=$('#app');if(!l){A.innerHTML='<h2>Email Review</h2><div class="card m">Nothing to review. Qualified leads with a draft appear here.</div>';return}
A.innerHTML=`<h2>Email Review <span class=m>${qi+1}/${q.length}</span></h2><div id=stack><div class="card sw" id=c>
<div class=row><b>${esc(l.name)}</b>${l.is_mock?'<span class="tag warn">MOCK</span>':''}<span class=tag>score ${l.score}</span><span class=tag>${l.confidence}</span><span class=tag>${l.status}</span><span class=tag>email: ${l.email_check||'unchecked'}</span></div>
<div class=m>${esc(l.service)} · ${l.evidence.filter(e=>e.kind=='verified').map(e=>'✔ '+esc(e.fact)).join(' · ')}</div><br>
To: <input id=to value="${esc(l.email)}" style="width:70%"><br>Subject: <input id=su value="${esc(l.subject)}" style="width:70%"><textarea id=bo>${esc(l.body)}</textarea>
${l.draft_flag?`<div class="warn card">${esc(l.draft_flag)}</div>`:''}</div></div>
<div class=row><button id=pv>◀</button><button id=rj>✕ Reject (←)</button><button id=ap class=pri>✓ Approve (→)</button><button id=nx>▶</button><button id=sd ${l.status=='approved'?'':'disabled'}>Send… (confirm)</button></div><p class=m>Swipe right = approve only. Nothing sends until you press Send and confirm.</p>`;
const save=()=>api('/leads/'+l.id,{method:'PATCH',body:{email:$('#to').value,subject:$('#su').value,body:$('#bo').value}});
const act=async k=>{try{await save();await api(`/leads/${l.id}/${k}`,{method:'POST'});toast(k=='approve'?'Approved — press Send to confirm sending':'Rejected');if(k=='reject'){q.splice(qi,1);qi=Math.min(qi,q.length-1);card()}else{l.status='approved';card()}}catch(e){toast(e.message)}};
$('#rj').onclick=()=>act('reject');$('#ap').onclick=()=>act('approve');$('#pv').onclick=()=>{qi=Math.max(0,qi-1);card()};$('#nx').onclick=()=>{qi=Math.min(q.length-1,qi+1);card()};
$('#sd').onclick=async()=>{if(!confirm(`Send this email to ${$('#to').value}?`+(l.is_mock?'':'\nMode is set in Settings (dry-run by default).')))return;$('#sd').disabled=1;try{await save();const r=await api(`/leads/${l.id}/send`,{method:'POST',body:{confirm:true}});toast(r.mode=='dry'?'DRY-RUN: logged, not really sent':'Sent');q.splice(qi,1);qi=Math.min(qi,q.length-1);card()}catch(e){toast('Failed: '+e.message);$('#sd').disabled=0}};
let x0=null;const c=$('#c');c.onpointerdown=e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;x0=e.clientX;c.classList.add('drag');c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(x0!==null)c.style.transform=`translateX(${e.clientX-x0}px) rotate(${(e.clientX-x0)/30}deg)`};
c.onpointerup=e=>{if(x0===null)return;const d=e.clientX-x0;x0=null;c.classList.remove('drag');c.style.transform='';if(d>120)act('approve');else if(d<-120)act('reject')}}
document.onkeydown=e=>{if(!$('#rj')||['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key=='ArrowLeft')$('#rj').click();if(e.key=='ArrowRight')$('#ap').click()};
V.fu=async()=>{const F=await api('/followups');$('#app').innerHTML='<h2>Follow-ups</h2><p class=m>Based on dates stored locally: checked whenever the app is open. Nothing sends without your confirm.</p>'+(F.map(f=>`<div class=card><b>${esc(f.name)}</b> <span class=m>${f.days_since} days since last email · follow-ups sent: ${f.followups_sent}</span><br>To: ${esc(f.email)}<br><input id=fs${f.id} value="${esc(f.subject)}" style="width:70%"><textarea id=fb${f.id} style="min-height:130px">${esc(f.body)}</textarea><div class=row><button onclick="api('/leads/${f.id}/replied',{method:'POST'}).then(()=>go('fu'))">Mark replied</button><button class=pri onclick="sendFu(${f.id},'${esc(f.email)}')">Send follow-up…</button></div></div>`).join('')||'<div class="card m">No follow-ups due.</div>')};
window.sendFu=async(id,to)=>{if(!confirm('Send follow-up to '+to+'?'))return;try{const r=await api(`/leads/${id}/followup-send`,{method:'POST',body:{confirm:true,subject:$('#fs'+id).value,body:$('#fb'+id).value}});toast(r.mode=='dry'?'DRY-RUN: logged only':'Sent');go('fu')}catch(e){toast(e.message)}};
V.hist=async()=>{const [h,s,rj]=await Promise.all([api('/history'),api('/suppression'),api('/leads?status=rejected')]);$('#app').innerHTML=`<h2>History</h2><div class=card><table><tr><th>Time<th>To<th>Result<th>Mode<th>Error${h.map(r=>`<tr><td>${r.ts}<td>${esc(r.to_email)}<td>${r.result}<td>${r.mode}<td>${esc(r.error||'')}`).join('')||'<tr><td class=m>No sends yet'}</table></div><div class=card><b>Rejected</b><br>${rj.map(x=>esc(x.name)).join(', ')||'<span class=m>none</span>'}</div><div class=card><b>Suppression list</b><br>${s.map(x=>esc(x.email)).join(', ')||'<span class=m>empty</span>'}</div>`};
V.set=async()=>{const s=await api('/settings'),st=await api('/status');const f=(k,t='text')=>`<label class=m>${k}</label><br><input id=s_${k} type=${t} value="${esc(s[k])}" ${k.includes('PASS')||k.includes('KEY')?`placeholder="${s['has_'+k]?'(saved — leave blank to keep)':''}"`:''}><br>`;
$('#app').innerHTML=`<h2>Settings</h2><div class=card><b>SMTP</b> <span class=m>Gmail/Outlook need an app password. SMTP_MODE=dry never sends.</span><br>${f('SMTP_MODE')}${f('SMTP_HOST')}${f('SMTP_PORT')}${f('SMTP_USER')}${f('SMTP_PASS','password')}${f('SMTP_FROM')}${f('SMTP_SECURE')}${f('SENDER_NAME')}${f('FOLLOWUP_DAYS')}${f('MAX_FOLLOWUPS')}${f('DAILY_LIMIT')}</div><div class=card><b>Research</b><br>${f('BRAVE_API_KEY','password')}${f('GOOGLE_PLACES_KEY','password')}<br><b>Laya</b> <span class=m>LAYA_ENABLED=1 turns on Laya (needs torch + big first-time model download)</span><br>${f('LAYA_ENABLED')}</div><button class=pri id=sv>Save</button> <button id=tt>Test SMTP login</button>
<div class=card><b>Laya</b><pre class=m>${esc(JSON.stringify(st.laya,null,2))}</pre></div>`;
$('#sv').onclick=()=>api('/settings',{method:'POST',body:Object.fromEntries([...document.querySelectorAll('[id^=s_]')].map(i=>[i.id.slice(2),i.value]))}).then(()=>toast('Saved'));
$('#tt').onclick=()=>api('/smtp/test',{method:'POST'}).then(r=>toast(r.message)).catch(e=>toast(e.message))};
go('ov');
</script></body></html>
